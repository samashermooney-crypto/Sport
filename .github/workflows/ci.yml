name: CI

on:
  push:
    branches: ['main', 'rebuild/**']
  pull_request:

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          [
            typecheck,
            lint,
            build,
            size,
            knip,
            sql-raw,
            openapi,
            registry,
            audit,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check
        run: |
          case '${{ matrix.check }}' in
            typecheck) npm run typecheck ;;
            lint) npm run lint ;;
            build) npm run build ;;
            size) npm run build && npm run size ;;
            knip) npm run knip ;;
            sql-raw) npm run check:sql-raw ;;
            openapi) npm run openapi && git diff --exit-code -- docs/api/openapi.json ;;
            registry) npm run registry && git diff --exit-code -- server/src/generated/registry.ts web/src/generated/registry.ts web/src/generated/nested-routes.ts shared/src/generated/errors.ts shared/src/generated/permissions.ts ;;
            audit) npm audit --omit=dev --audit-level=high ;;
          esac

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Initialize PostgreSQL roles and databases
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/init/001-roles.sql
      - name: Set ephemeral database role passwords
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE athlentry_admin PASSWORD 'athlentry-admin-ci-only'; ALTER ROLE athlentry_app PASSWORD 'athlentry-ci-only'"
      - name: Run tests with coverage
        env:
          DATABASE_ADMIN_URL: postgres://athlentry_admin:athlentry-admin-ci-only@127.0.0.1:5432/athlentry_test
          DATABASE_APP_URL: postgres://athlentry_app:athlentry-ci-only@127.0.0.1:5432/athlentry_test
        run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium webkit
      - name: Capture Linux legacy parity references
        run: bash e2e/visual-reference/linux-baseline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-parity-references
          path: |
            e2e/visual-reference/*-linux.png
            e2e/visual-reference/parity-baselines.json
          if-no-files-found: ignore
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/visual-reference/*-linux.png
            e2e/visual-reference/parity-baselines.json
          if-no-files-found: ignore

  phase14-lighthouse:
    name: Phase 14 website Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit registered website routes
        run: npm run perf:lighthouse:website
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase14-lighthouse-results
          path: perf/results/phase14-shared-app/
          if-no-files-found: ignore
