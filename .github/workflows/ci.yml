name: CI

on:
  push:
    branches: ['main', 'rebuild/**']
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, build, size, knip, openapi, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check
        run: |
          case '${{ matrix.check }}' in
            typecheck) npm run typecheck ;;
            lint) npm run lint ;;
            build) npm run build ;;
            size) npm run build && npm run size ;;
            knip) npm run knip ;;
            openapi) npm run openapi && git diff --exit-code -- docs/api/openapi.json ;;
            audit) npm audit --omit=dev --audit-level=high ;;
          esac

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Initialize PostgreSQL roles and databases
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/init/001-roles.sql
      - name: Run tests with coverage
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/athlentry_test
        run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
